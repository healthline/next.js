name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# CI only reads the repository, so its token can do no more.
permissions:
  contents: read

# Only the newest run per ref matters; cancel the ones it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/env-setup
        with:
          node_auth_token: ${{ secrets.NPM_TOKEN }}

      # Build first: test/output-dependencies.test.js reads the built node/ and
      # browser/ trees, and the build fails on a missing build dependency
      # (node-notifier, once) that lint and tests do not catch.
      - run: yarn build

      # Yarn 4 runs no pre/post hooks around a script like `test`, so lint
      # has its own step.
      - run: yarn lint

      - run: yarn test --ci

      # Packing rebuilds node/ and browser/ and rewrites package.json, so the
      # pack suite runs alone, after the suites that read them.
      - run: yarn jest --selectProjects pack --runInBand --ci
